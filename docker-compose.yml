version: '3.9'

services:
  # Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: showcaise-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks:
      - frontend-net
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: showcaise-frontend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_WS_URL=${REACT_APP_WS_URL}
    networks:
      - frontend-net
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: showcaise-api-gateway
    ports:
      - "${API_GATEWAY_PORT}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - postgres
      - redis
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Video Processing Service
  video-processing:
    build:
      context: ./services/video-processing
      dockerfile: Dockerfile
    container_name: showcaise-video-processing
    environment:
      - REDIS_URL=${REDIS_URL}
      - MINIO_URL=${MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MAX_VIDEO_SIZE_MB=${MAX_VIDEO_SIZE_MB}
      - MAX_VIDEO_DURATION_MINUTES=${MAX_VIDEO_DURATION_MINUTES}
      - FRAME_SAMPLING_FPS=${FRAME_SAMPLING_FPS}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - /tmp/video-processing:/tmp
    depends_on:
      - redis
      - minio
    networks:
      - backend-net
    restart: unless-stopped

  # Celery Worker for Video Processing
  video-worker:
    build:
      context: ./services/video-processing
      dockerfile: Dockerfile
    container_name: showcaise-video-worker
    command: celery -A app.tasks worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY}
    environment:
      - REDIS_URL=${REDIS_URL}
      - MINIO_URL=${MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - /tmp/video-processing:/tmp
    depends_on:
      - redis
      - minio
    networks:
      - backend-net
    restart: unless-stopped

  # Speech Analysis Service
  speech-analysis:
    build:
      context: ./services/speech-analysis
      dockerfile: Dockerfile
    container_name: showcaise-speech-analysis
    environment:
      - REDIS_URL=${REDIS_URL}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - TOGETHER_AI_API_KEY=${TOGETHER_AI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL}
      - TRANSCRIPTION_LANGUAGE=${TRANSCRIPTION_LANGUAGE}
      - FILLER_WORDS=${FILLER_WORDS}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - redis
    networks:
      - backend-net
    restart: unless-stopped

  # Computer Vision Service
  computer-vision:
    build:
      context: ./services/computer-vision
      dockerfile: Dockerfile
    container_name: showcaise-computer-vision
    environment:
      - REDIS_URL=${REDIS_URL}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - TOGETHER_AI_API_KEY=${TOGETHER_AI_API_KEY}
      - CV_CONFIDENCE_THRESHOLD=${CV_CONFIDENCE_THRESHOLD}
      - EYE_CONTACT_THRESHOLD_DEGREES=${EYE_CONTACT_THRESHOLD_DEGREES}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - redis
    networks:
      - backend-net
    restart: unless-stopped

  # Avatar Generation Service
  avatar-generation:
    build:
      context: ./services/avatar-generation
      dockerfile: Dockerfile
    container_name: showcaise-avatar-generation
    environment:
      - REDIS_URL=${REDIS_URL}
      - DID_API_KEY=${DID_API_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - AVATAR_GENERATION_TIMEOUT_SECONDS=${AVATAR_GENERATION_TIMEOUT_SECONDS}
      - AVATAR_VOICE_STYLE=${AVATAR_VOICE_STYLE}
      - MINIO_URL=${MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - redis
      - minio
    networks:
      - backend-net
    restart: unless-stopped

  # Analytics Service
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: showcaise-analytics
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENABLE_RECOMMENDATIONS=${ENABLE_RECOMMENDATIONS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - postgres
      - redis
    networks:
      - backend-net
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: showcaise-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache + Message Queue)
  redis:
    image: redis:7-alpine
    container_name: showcaise-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: showcaise-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: showcaise-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS}d'
    networks:
      - backend-net
    restart: unless-stopped

  # Grafana (Monitoring Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: showcaise-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend-net
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
