version: '3.9'

# Development override configuration for hot-reloading and debugging

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm start

  api-gateway:
    volumes:
      - ./services/api-gateway/app:/app/app
    environment:
      - DEBUG=true
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  video-processing:
    volumes:
      - ./services/video-processing/app:/app/app
    environment:
      - DEBUG=true
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  video-worker:
    volumes:
      - ./services/video-processing/app:/app/app
    environment:
      - DEBUG=true

  speech-analysis:
    volumes:
      - ./services/speech-analysis/app:/app/app
    environment:
      - DEBUG=true
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  computer-vision:
    volumes:
      - ./services/computer-vision/app:/app/app
    environment:
      - DEBUG=true
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  avatar-generation:
    volumes:
      - ./services/avatar-generation/app:/app/app
    environment:
      - DEBUG=true
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  analytics:
    volumes:
      - ./services/analytics/app:/app/app
    environment:
      - DEBUG=true
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
